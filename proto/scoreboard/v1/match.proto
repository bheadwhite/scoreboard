syntax = "proto3";

package scoreboard.v1;

import "scoreboard/v1/common.proto";

// MatchService runs the match lifecycle, including the concession protocol that
// is the whole point of this app:
//
//   LOBBY -> IN_PROGRESS -> CLAIMED -> FINAL       (all opponents concede, or timeout)
//                              ^  \
//                              |   -> DISPUTED -> FINAL | CANCELED  (owner resolves)
//                              |        |
//                              +--------+   (the last objection is withdrawn)
//
// CLAIMED and DISPUTED are two readings of the same situation — a claim on the
// table and a set of answers to it — rather than two destinations. Nobody is
// held to the answer they first gave: an opponent can move between conceding
// and objecting for as long as the match is open, and WithdrawClaim takes the
// whole thing back to IN_PROGRESS. Only FINAL is a one-way door, and only FINAL
// matches count toward the scoreboard.
service MatchService {
  rpc CreateMatch(CreateMatchRequest) returns (CreateMatchResponse);
  rpc JoinMatch(JoinMatchRequest) returns (JoinMatchResponse);
  rpc LeaveMatch(LeaveMatchRequest) returns (LeaveMatchResponse);
  // Turn down an invitation. The match carries on without you.
  rpc DeclineMatch(DeclineMatchRequest) returns (DeclineMatchResponse);
  // Ask more players once the lobby already exists.
  rpc InvitePlayers(InvitePlayersRequest) returns (InvitePlayersResponse);
  // Replaces the whole team layout while still in the lobby.
  rpc SetTeams(SetTeamsRequest) returns (SetTeamsResponse);
  rpc SetContract(SetContractRequest) returns (SetContractResponse);
  // Affirm, or withdraw, that you are ready to play under the current
  // contract. Changing the contract or the teams clears everyone's.
  rpc SetReady(SetReadyRequest) returns (SetReadyResponse);
  // Locks the contract and begins play. Creator only, and only once every
  // joined player is ready.
  rpc StartMatch(StartMatchRequest) returns (StartMatchResponse);

  // Claim victory for the caller's team. Starts the concession clock.
  // Idempotent: re-claiming by the same team is a no-op.
  rpc ClaimVictory(ClaimVictoryRequest) returns (ClaimVictoryResponse);
  // Take back a claim your own team made. The match returns to IN_PROGRESS with
  // no winner and every answer cleared — this is "never mind", not "you won".
  // Anyone on the claiming team may do it, and only until the match finalizes.
  rpc WithdrawClaim(WithdrawClaimRequest) returns (WithdrawClaimResponse);
  // Acknowledge the standing claim. Idempotent, and reversible: this also
  // withdraws an objection you made earlier. Taking back the last objection
  // returns the match to CLAIMED and restarts its clock.
  rpc Concede(ConcedeRequest) returns (ConcedeResponse);
  // Reject the standing claim, or take back a concession you already gave.
  // Stops the concession clock for as long as the objection stands.
  rpc DisputeMatch(DisputeMatchRequest) returns (DisputeMatchResponse);
  // Owner only, and only once the match is genuinely stuck — see
  // Match.organizer_may_resolve. Settles it by naming the winning team, or
  // voids it.
  rpc ResolveDispute(ResolveDisputeRequest) returns (ResolveDisputeResponse);

  rpc CancelMatch(CancelMatchRequest) returns (CancelMatchResponse);

  // Service administrator only, and the only way anything leaves the permanent
  // record. The match is erased — its teams, its participations, every
  // concession and objection on it — rather than marked, so it stops existing
  // everywhere at once instead of lingering as a row every stats query has to
  // remember to skip.
  //
  // Deliberately not offered to a family organizer, however stuck the match is.
  // Undoing a ratified result is not adjudication, it is correcting a mistake in
  // the record, and the whole argument of this app is that the organizer does
  // not get to do that. What they get is ResolveDispute, which still ends in
  // somebody named as the winner.
  rpc VoidMatch(VoidMatchRequest) returns (VoidMatchResponse);

  rpc GetMatch(GetMatchRequest) returns (GetMatchResponse);
  rpc ListMatches(ListMatchesRequest) returns (ListMatchesResponse);
}

message CreateMatchRequest {
  string family_id = 1;
  string game_id = 2;
  // Players to invite. They are asked, not added — each decides for themselves,
  // and the match can start without the ones who never answer.
  repeated string invite_user_ids = 3;
}

message CreateMatchResponse {
  Match match = 1;
}

message JoinMatchRequest {
  string match_id = 1;
}

message JoinMatchResponse {
  Match match = 1;
}

message LeaveMatchRequest {
  string match_id = 1;
}

message LeaveMatchResponse {
  Match match = 1;
}

message DeclineMatchRequest {
  string match_id = 1;
}

message DeclineMatchResponse {
  Match match = 1;
}

message InvitePlayersRequest {
  string match_id = 1;
  repeated string user_ids = 2;
}

message InvitePlayersResponse {
  Match match = 1;
}

// One side of a match. Omit team_id to create a new team.
message TeamAssignment {
  string team_id = 1;
  string name = 2;
  repeated string user_ids = 3;
}

message SetTeamsRequest {
  string match_id = 1;
  // The complete team layout. Every participant must appear exactly once.
  repeated TeamAssignment teams = 2;
}

message SetTeamsResponse {
  Match match = 1;
}

message SetContractRequest {
  string match_id = 1;
  Contract contract = 2;
}

message SetContractResponse {
  Match match = 1;
}

message SetReadyRequest {
  string match_id = 1;
  bool ready = 2;
}

message SetReadyResponse {
  Match match = 1;
}

message StartMatchRequest {
  string match_id = 1;
}

message StartMatchResponse {
  Match match = 1;
}

message ClaimVictoryRequest {
  string match_id = 1;
  // Defaults to the caller's own team.
  string team_id = 2;
}

message ClaimVictoryResponse {
  Match match = 1;
}

message WithdrawClaimRequest {
  string match_id = 1;
}

message WithdrawClaimResponse {
  Match match = 1;
}

message ConcedeRequest {
  string match_id = 1;
}

message ConcedeResponse {
  Match match = 1;
}

message DisputeMatchRequest {
  string match_id = 1;
  // Shown to the family owner when they resolve it.
  string reason = 2;
}

message DisputeMatchResponse {
  Match match = 1;
}

message ResolveDisputeRequest {
  string match_id = 1;
  // The team that actually won. Leave empty to void the match instead.
  string winning_team_id = 2;
  bool void_match = 3;
}

message ResolveDisputeResponse {
  Match match = 1;
}

message CancelMatchRequest {
  string match_id = 1;
}

message CancelMatchResponse {
  Match match = 1;
}

message VoidMatchRequest {
  string match_id = 1;
  // Why. Written to the server log, which is the only trace a voided match
  // leaves. Optional — the log records who, what and when either way.
  string reason = 2;
}

message VoidMatchResponse {
  // The family it belonged to, so the caller knows what to refresh. There is no
  // match to send back.
  string family_id = 1;
}

message GetMatchRequest {
  string match_id = 1;
}

message GetMatchResponse {
  Match match = 1;
}

message ListMatchesRequest {
  string family_id = 1;
  // Empty means every status.
  repeated MatchStatus statuses = 2;
  // Restrict to matches this user played in.
  string user_id = 3;
  int32 limit = 4;
  int32 offset = 5;
}

message ListMatchesResponse {
  repeated Match matches = 1;
}
