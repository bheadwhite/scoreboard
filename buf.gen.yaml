version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/bheadwhite/scoreboard/backend/gen
plugins:
  # Go: messages
  - local: protoc-gen-go
    out: backend/gen
    opt: paths=source_relative
  # Go: Connect service handlers/clients
  - local: protoc-gen-connect-go
    out: backend/gen
    opt: paths=source_relative
  # TypeScript: messages + service descriptors (connect-es v2 needs only this)
  - local: ./node_modules/.bin/protoc-gen-es
    out: frontend/src/gen
    opt:
      - target=ts
      - import_extension=js
