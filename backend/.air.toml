# Live reload for the API during development.
#
# `go run` compiles once, so every backend edit otherwise means stopping and
# restarting by hand — easy to forget, and the symptom is a change that appears
# not to have worked.
#
# Only used by `make dev-api`, and only when air is installed; the Makefile
# falls back to `go run` otherwise.

root = "."
tmp_dir = ".air"

[build]
  cmd = "go build -o ./.air/server ./cmd/server"
  bin = "./.air/server"
  include_ext = ["go", "sql"]
  # Generated code counts: regenerating protos should restart the server.
  exclude_dir = [".air", "migrations/.git"]
  exclude_regex = ["_test\\.go"]
  # Wait for a burst of writes to settle rather than rebuilding mid-save.
  delay = 400
  stop_on_error = true
  send_interrupt = true
  kill_delay = 2000

[log]
  time = false
  main_only = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
